# The canvas. Every frame lives in one shared coordinate space (0,0 = centre of the hub).
#   cx, cy : centre of the frame in world units
#   k      : the frame's scale on the canvas (1 = life-size)
#   w, h   : the frame's native size; its content is laid out at this size
#   d      : diameter of the circle you see before zooming in (native units, scaled by k)
#   stat   : the short line shown inside the circle
#   peek   : how many world units of a circle show at the very bottom of the overview
#   align  : top = circle label sits near the top (for the circle that rises from below)
#   side   : -1 = left column, 1 = right column. On wide screens these slide outward to fill the width.
# The order of this list is the tour order. Move a circle by changing cx / cy, resize it with k.
# Layout: Experience + Projects on the left, Skills + Certifications on the right,
# Education centred under the hub, Contact beneath everything.

