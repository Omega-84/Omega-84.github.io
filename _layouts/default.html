<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">

  <link rel="apple-touch-icon" sizes="180x180" href="{{ "/assets/favicon/apple-touch-icon.png" | prepend: site.baseurl }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/favicon/favicon-32x32.png" | prepend: site.baseurl }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/favicon/favicon-16x16.png" | prepend: site.baseurl }}">
  <link rel="manifest" href="{{ "/assets/favicon/site.webmanifest" | prepend: site.baseurl }}">

  {% seo %}

  <link rel="stylesheet" href="{{ "/assets/css/main.min.css" | prepend: site.baseurl }}">
  <link rel="stylesheet" href="{{ "/assets/css/vendors.min.css" | prepend: site.baseurl }}">

  <script src="{{ "/assets/js/vendors.min.js" | prepend: site.baseurl }}"></script>
  <script src="{{ "/assets/js/app.min.js" | prepend: site.baseurl }}"></script>
  <noscript><style>.frame-content{display:block !important}.frame-cover{display:none !important}.world-path,.hud{display:none !important}</style></noscript>
</head>

<body>
  <a href="#viewer" class="skip-link">Skip to content</a>
  {% include navbar.html %}
  <div id="preloader">
    <div class="load"><span class="load-dot"></span></div>
  </div>
  {% include world.html %}

  <!-- Back to Top Button -->
  <button class="back-to-top" aria-label="Back to top">
    <svg viewBox="0 0 24 24">
      <path d="M18 15l-6-6-6 6" />
    </svg>
  </button>

  {% include footer.html %}

  <!-- Page Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const navbar = document.querySelector('.navbar');
      const toggle = document.querySelector('.navbar-toggle');
      const menu = document.querySelector('.navbar-menu');

      // The navbar (with the Contact pill) stays visible at all times so
      // reaching out is always one click away.
      navbar.classList.add('navbar-visible');

      // Mobile menu toggle
      if (toggle && menu) {
        toggle.addEventListener('click', () => {
          const isOpen = menu.classList.toggle('active');
          toggle.setAttribute('aria-expanded', isOpen);
        });

        menu.querySelectorAll('a').forEach(link => {
          link.addEventListener('click', () => {
            menu.classList.remove('active');
            toggle.setAttribute('aria-expanded', 'false');
          });
        });
      }

      // Back to Top Button
      const backToTop = document.querySelector('.back-to-top');
      if (backToTop) {
        window.addEventListener('scroll', () => {
          if (window.pageYOffset > 500) {
            backToTop.classList.add('visible');
          } else {
            backToTop.classList.remove('visible');
          }
        });

        backToTop.addEventListener('click', () => {
          window.scrollTo({
            top: 0,
            behavior: 'smooth'
          });
        });
      }

      // GA4 click tracking for elements marked with data-track
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-track]');
        if (el) {
          track(el.dataset.track, { label: el.dataset.trackLabel || '' });
        }
      });
    });
  </script>
</body>

</html>
