<div class="panel-body contact-grid">
  <div class="contact-intro">
  <h2 class="title">Let's talk</h2>
  <p class="lead">{{site.contact_description}}</p>

  <div class="contact-fallback">
    <button type="button" class="contact-email-copy" data-email="{{ site.email }}" aria-label="Copy email address">
      <span class="contact-email-text">{{ site.email }}</span>
      <span class="contact-email-copied">Copied!</span>
    </button>

    <div class="contact-icons">
      {% if site.email and site.email != "" %}
      <a href="mailto:{{site.email}}" aria-label="My E-Mail">Email</a>
      {% endif %}
      {% if site.github_username and site.github_username != "" %}
      <a href="https://github.com/{{site.github_username}}" target="_blank" rel="noreferrer" aria-label="My GitHub">GitHub</a>
      {% endif %}
      {% if site.linkedin_username and site.linkedin_username != "" %}
      <a href="https://www.linkedin.com/in/{{site.linkedin_username}}" target="_blank" rel="noreferrer" aria-label="My LinkedIn">LinkedIn</a>
      {% endif %}
    </div>
  </div>
  </div>

  <form class="contact-form" action="{{ site.formspree_endpoint }}" method="POST">
    <div>
      <label for="contact-name">Name</label>
      <input type="text" id="contact-name" name="name" required>
    </div>
    <div>
      <label for="contact-email">Email</label>
      <input type="email" id="contact-email" name="_replyto" required>
    </div>
    <div>
      <label for="contact-message">Message</label>
      <textarea id="contact-message" name="message" rows="4" required></textarea>
    </div>
    <button type="submit" class="btn-primary" data-track="contact_click" data-track-label="form_submit">Send message</button>
  </form>

</div>
