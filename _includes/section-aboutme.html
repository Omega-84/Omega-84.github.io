<h1 class="title">{{site.about_me_title}}</h1>
<div class="about-container">
  <div class="about-image" data-aos="fade-right">
    <img src="{{ site.baseurl }}/assets/img/profile.JPG" alt="{{ site.title }}">
  </div>
  <div class="about-content" data-aos="fade-left">
    <p class="description">{{site.about_me_description}}</p>
  </div>
</div>

<!-- Impact Stats Counter Bar -->
<div class="stats-bar" data-aos="fade-up" data-aos-delay="200">
  <div class="stat-item">
    <span class="stat-number" data-target="3">0</span><span class="stat-suffix">+</span>
    <span class="stat-label">Years Experience</span>
  </div>
  <div class="stat-divider"></div>
  <div class="stat-item">
    <span class="stat-number" data-target="8">0</span><span class="stat-suffix">+</span>
    <span class="stat-label">Projects Shipped</span>
  </div>
  <div class="stat-divider"></div>
  <div class="stat-item">
    <span class="stat-number" data-target="28">0</span><span class="stat-suffix">%</span>
    <span class="stat-label">Customer Acq. Lift</span>
  </div>
  <div class="stat-divider"></div>
  <div class="stat-item">
    <span class="stat-number" data-target="32">0</span><span class="stat-suffix">%</span>
    <span class="stat-label">Default Reduction</span>
  </div>
  <div class="stat-divider"></div>
  <div class="stat-item">
    <span class="stat-number stat-gpa" data-target="3.8">3.8</span><span class="stat-suffix">/4.0</span>
    <span class="stat-label">GPA @ Northeastern</span>
  </div>
</div>

<!-- Status Badge -->
<div class="status-badge-wrapper" data-aos="fade-up" data-aos-delay="400">
  <div class="status-badge">
    <span class="status-dot"></span>
    <span class="status-text">Open to Work, Data Scientist · ML Engineer · Business Analyst</span>
  </div>
</div>
