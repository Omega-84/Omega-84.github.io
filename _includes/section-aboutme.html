<div class="term-titlebar">
  <span class="term-dot dot-red"></span>
  <span class="term-dot dot-amber"></span>
  <span class="term-dot dot-green"></span>
  <span class="term-title">about.sh — 80x24</span>
</div>
<div class="term-body">
  <h1 class="title">cat about.txt</h1>
  <p class="subtitle">{{site.about_me_description}}</p>

  <div class="kv-list">
    <div class="kv-row">
      <span class="kv-key">years_experience</span>
      <span class="kv-val">3+</span>
    </div>
    <div class="kv-row">
      <span class="kv-key">projects_shipped</span>
      <span class="kv-val">8+</span>
    </div>
    <div class="kv-row">
      <span class="kv-key">customer_acq_lift</span>
      <span class="kv-val">28%</span>
    </div>
    <div class="kv-row">
      <span class="kv-key">default_reduction</span>
      <span class="kv-val">32%</span>
    </div>
    <div class="kv-row">
      <span class="kv-key">gpa_northeastern</span>
      <span class="kv-val">3.8/4.0</span>
    </div>
  </div>

  <div class="chip-row">
    <span class="chip">[ open_to_work ]</span>
    {% if site.certification and site.certification != "" %}
    <span class="chip chip-amber">[ cert: {{ site.certification }} ]</span>
    {% endif %}
  </div>
</div>
