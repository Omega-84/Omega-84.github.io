<div class="profile">
  <img class="profile-photo" src="{{ "/assets/img/profile-800.jpg" | prepend: site.baseurl }}" alt="Varun Nayyar" width="220" height="220">
  <p class="profile-eyebrow">Data Scientist &amp; Data Engineer</p>
  <h1 class="profile-name">Varun Nayyar</h1>
  <p class="profile-summary">{{ site.summary }}</p>

  <div class="profile-figures">
    {% for fig in site.data.figures %}
    <div class="figure">
      <span class="figure-value">{{ fig.value }}</span>
      <span class="figure-label">{{ fig.label }}</span>
    </div>
    {% endfor %}
  </div>

  <div class="profile-certs">
    {% for cert in site.data.certifications %}
    <div class="profile-cert">
      <span class="profile-cert-issuer">Microsoft Certified</span>
      <span class="profile-cert-name">{{ cert.name }}</span>
      <span class="profile-cert-code">{{ cert.code }}</span>
    </div>
    {% endfor %}
  </div>

  <div class="profile-cta">
    <a class="btn-primary" href="#contact" data-track="contact_click" data-track-label="profile_get_in_touch">Get in touch</a>
    <a class="btn-ghost" href="{{ site.cv_download_link }}" target="_blank" rel="noreferrer" data-track="resume_click">Resume</a>
  </div>
</div>
